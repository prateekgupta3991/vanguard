services:
  vanguard:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      VANGUARD_HTTP_ADDRESS: :8081
    ports:
      - "8081:8081"
    restart: unless-stopped

  ui:
    build:
      context: web
      dockerfile: Dockerfile
    depends_on:
      - vanguard
    ports:
      - "5173:5173"
    restart: unless-stopped
